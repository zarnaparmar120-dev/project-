<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare Dashboard</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] },
                    colors: {
                        cream: { 50:'#FFFDF9', 100:'#FFF8F0', 200:'#FFF0DE', 300:'#FFE4C4', 400:'#F5D6B8', 500:'#D4A574', 600:'#B8864E', 700:'#8B6B3E' },
                        bark: { 50:'#FAF6F2', 100:'#F0E6D8', 200:'#E0D0BC', 300:'#C4A882', 400:'#8B7355', 500:'#6B5640', 600:'#3D2C2E', 700:'#2A1F20' },
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body { font-family: 'Poppins', sans-serif; background: #FFF8F0; color: #3D2C2E; overflow-x: hidden; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #FFF8F0; }
        ::-webkit-scrollbar-thumb { background: #D4A574; border-radius: 4px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        /* Card Style (Exact match) */
        .card { background: #fff; border-radius: 20px; border: 1px solid #F0E6D8; box-shadow: 0 2px 16px rgba(139,107,62,.05); }

        /* Buttons (Exact match) */
        .btn-warm { background: linear-gradient(135deg,#D4A574,#C4956A); color: #fff; border-radius: 14px; font-weight: 600; padding: 10px 22px; transition: transform 0.2s; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn-warm:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(212,165,116,0.3); }
        .btn-outline { background: #fff; border: 2px solid #F0E6D8; border-radius: 14px; color: #3D2C2E; font-weight: 600; padding: 10px 22px; transition: all 0.2s; cursor: pointer; font-size: 14px; }
        .btn-outline:hover { border-color: #D4A574; background: #FFF8F0; }

        /* Status Badges */
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-pending { background: #FFF6D6; color: #D97706; }
        .status-confirmed { background: #DEF0E1; color: #059669; }
        .status-rejected { background: #FDE8E5; color: #DC2626; }
        .status-completed { background: #F0E6D8; color: #78716C; }

        /* Sidebar Active State */
        .nav-item.active { background: #FFF8F0; color: #D4A574; border-left: 4px solid #D4A574; }
        .nav-item { border-left: 4px solid transparent; transition: all 0.2s; }

        /* Mobile Bottom Nav */
        .mobile-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #8B7355; gap: 2px; }
        .mobile-nav-item.active { color: #D4A574; }

        /* Toast */
        #toast { transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body class="antialiased h-screen flex flex-col">

    <!-- TOAST SYSTEM -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-bark-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
        <span id="t-icon">🐾</span>
        <span id="t-msg" class="font-medium text-sm"></span>
    </div>

    <!-- ROLE SELECTION MODAL (Mandatory) -->
    <div id="role-modal" class="fixed inset-0 z-50 bg-bark-900/60 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="card max-w-2xl w-full p-8 md:p-12 animate-fade relative overflow-hidden">
            <!-- Decorative blobs -->
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-cream-200/50 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-bark-200/50 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-10 relative z-10">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cream-500 to-cream-700 mx-auto mb-4 flex items-center justify-center text-white text-3xl shadow-lg">🐾</div>
                <h2 class="text-3xl font-bold text-bark-600 mb-2">Welcome to PawCare</h2>
                <p class="text-bark-400">Who are you logging in as today?</p>
            </div>

            <div class="grid md:grid-cols-2 gap-6 relative z-10">
                <!-- Pet Owner Card -->
                <div onclick="loginAs('user')" class="group cursor-pointer p-6 rounded-2xl border-2 border-transparent bg-cream-50 hover:border-cream-500 hover:shadow-lg transition-all duration-300 flex flex-col items-center text-center">
                    <div class="w-20 h-20 rounded-full bg-white shadow-sm flex items-center justify-center text-4xl mb-4 group-hover:scale-110 transition-transform">🐕</div>
                    <h3 class="text-xl font-bold text-bark-600 mb-1">Pet Owner</h3>
                    <p class="text-sm text-bark-400">Manage your pet's health & appointments</p>
                </div>

                <!-- Veterinarian Card -->
                <div onclick="loginAs('doctor')" class="group cursor-pointer p-6 rounded-2xl border-2 border-transparent bg-bark-600 text-white hover:bg-bark-700 hover:shadow-xl transition-all duration-300 flex flex-col items-center text-center">
                    <div class="w-20 h-20 rounded-full bg-bark-500/50 border border-bark-400 flex items-center justify-center text-4xl mb-4 group-hover:scale-110 transition-transform">🩺</div>
                    <h3 class="text-xl font-bold mb-1">Veterinarian</h3>
                    <p class="text-sm text-bark-200">Manage patients, schedule & earnings</p>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOKING MODAL -->
    <div id="booking-modal" class="fixed inset-0 z-50 bg-bark-900/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="card w-full max-w-md p-6 animate-fade relative">
            <button onclick="document.getElementById('booking-modal').classList.add('hidden')" class="absolute top-4 right-4 p-2 hover:bg-cream-100 rounded-full text-bark-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-xl font-bold text-bark-600 mb-6">New Appointment 📅</h3>
            <form onsubmit="handleBookingSubmit(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-bark-500 uppercase mb-1 block">Select Doctor</label>
                    <select id="book-doc" class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                        <option value="Dr. Sarah Mitchell">Dr. Sarah Mitchell (General)</option>
                        <option value="Dr. James Cooper">Dr. James Cooper (Surgery)</option>
                        <option value="Dr. Emily Chen">Dr. Emily Chen (Dermatology)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-bark-500 uppercase mb-1 block">Pet Name</label>
                    <input type="text" id="book-pet" placeholder="e.g. Max" required class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-bark-500 uppercase mb-1 block">Date</label>
                        <input type="date" id="book-date" required class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-bark-500 uppercase mb-1 block">Time</label>
                        <input type="time" id="book-time" required class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-bark-500 uppercase mb-1 block">Notes</label>
                    <textarea id="book-notes" rows="2" placeholder="Symptoms or reason for visit..." class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500"></textarea>
                </div>
                <button type="submit" class="btn-warm w-full justify-center">Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- ADD PET MODAL -->
    <div id="pet-modal" class="fixed inset-0 z-50 bg-bark-900/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="card w-full max-w-md p-6 animate-fade relative">
            <button onclick="document.getElementById('pet-modal').classList.add('hidden')" class="absolute top-4 right-4 p-2 hover:bg-cream-100 rounded-full text-bark-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-xl font-bold text-bark-600 mb-6">Add New Pet 🐾</h3>
            <form onsubmit="handleAddPetSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="pet-name" placeholder="Pet Name" required class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                    <select id="pet-type" class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                        <option value="Dog">🐕 Dog</option>
                        <option value="Cat">🐈 Cat</option>
                        <option value="Bird">🦜 Bird</option>
                        <option value="Other">🐰 Other</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="pet-breed" placeholder="Breed" required class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                    <input type="number" id="pet-age" placeholder="Age (yrs)" required class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                </div>
                <div>
                    <input type="number" id="pet-weight" placeholder="Weight (kg)" required class="w-full bg-cream-50 border border-bark-100 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cream-500">
                </div>
                <button type="submit" class="btn-warm w-full justify-center">Add Pet Profile</button>
            </form>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav id="navbar" class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-bark-100 hidden h-16 flex items-center justify-between px-4 md:px-8 transition-all duration-300">
        <!-- Logo -->
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-cream-500 flex items-center justify-center text-white shadow-sm">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12 18.5c-2.5 0-4.5-1-6-3-.8-1.1-1.2-2.3-1.2-3.5C4.8 9.5 7 7 10 6.5c.5-2 2-3.5 4-3.5s3.5 1.5 4 3.5c3 .5 5.2 3 5.2 5.5 0 1.2-.4 2.4-1.2 3.5-1.5 2-3.5 3-6 3h-4z"/><circle cx="8" cy="5" r="1.8"/><circle cx="16" cy="5" r="1.8"/><circle cx="6" cy="8" r="1.5"/><circle cx="18" cy="8" r="1.5"/></svg>
            </div>
            <span class="text-lg font-bold text-bark-600 tracking-tight">PawCare</span>
        </div>

        <!-- Center Links (Desktop) -->
        <div id="nav-links" class="hidden md:flex items-center gap-6 text-sm font-medium text-bark-400">
            <!-- Injected by JS based on role -->
        </div>

        <!-- Right Side -->
        <div class="flex items-center gap-4">
            <!-- Notification Bell -->
            <div class="relative group">
                <button class="p-2 hover:bg-cream-50 rounded-full text-bark-400 transition-colors relative">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span id="notif-badge" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white hidden"></span>
                </button>
                <!-- Dropdown -->
                <div class="absolute right-0 top-full mt-2 w-64 bg-white rounded-2xl shadow-xl border border-bark-100 p-3 hidden group-hover:block animate-fade z-50">
                    <h4 class="text-xs font-bold text-bark-500 uppercase mb-2 px-2">Recent Activity</h4>
                    <div id="notif-list" class="space-y-2">
                        <!-- JS Populated -->
                        <div class="text-xs text-bark-300 text-center py-2">No new notifications</div>
                    </div>
                </div>
            </div>

            <!-- User Info -->
            <div id="nav-user-area" class="hidden md:flex items-center gap-3">
                <!-- Injected by JS -->
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="md:hidden p-2 text-bark-600"><i data-lucide="menu" class="w-6 h-6"></i></button>
        </div>
    </nav>

    <!-- MAIN LAYOUT (Sidebar + Content) -->
    <div id="main-container" class="flex-1 flex overflow-hidden hidden relative">
        
        <!-- Desktop Sidebar -->
        <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-white border-r border-bark-100 h-full">
            <div class="p-6 pb-2">
                <div id="sidebar-profile" class="flex items-center gap-3 mb-6">
                    <!-- Injected by JS -->
                </div>
                <nav id="sidebar-nav" class="space-y-1">
                    <!-- Tabs Injected by JS -->
                </nav>
            </div>
            <div class="mt-auto p-6 border-t border-bark-100">
                <button onclick="logout()" class="flex items-center gap-3 text-red-500 font-semibold text-sm hover:text-red-600 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="content-area" class="flex-1 overflow-y-auto bg-[#FFF8F0] p-4 md:p-8 pb-24 md:pb-8 scroll-smooth">
            <!-- Dynamic Content Loads Here -->
        </main>

        <!-- Mobile Bottom Nav -->
        <div id="mobile-nav" class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-bark-100 flex justify-around py-3 z-30 pb-safe">
            <!-- Injected by JS -->
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ================= STATE & DATA =================
        let currentUserRole = null;
        let currentUserName = '';
        let currentTab = 'overview';

        const doctorsList = [
            { name: 'Dr. Sarah Mitchell', spec: 'Small Animal Specialist' },
            { name: 'Dr. James Cooper', spec: 'Surgeon' },
            { name: 'Dr. Emily Chen', spec: 'Dermatologist' }
        ];

        // Initial Mock Data if LocalStorage is empty
        const initialPets = [
            { id: 1, name: 'Max', type: 'Dog', breed: 'Golden Retriever', age: 3, weight: 28, img: 'https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&q=80&w=300' },
            { id: 2, name: 'Bella', type: 'Cat', breed: 'Persian', age: 2, weight: 4, img: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&q=80&w=300' }
        ];

        // ================= INITIALIZATION =================
        window.onload = function() {
            lucide.createIcons();
            const userStr = localStorage.getItem('pc_user');
            if (!userStr) {
                document.getElementById('role-modal').classList.remove('hidden');
                document.getElementById('role-modal').classList.add('flex');
            } else {
                const user = JSON.parse(userStr);
                currentUserRole = user.role;
                currentUserName = user.name;
                showDashboard();
            }
        };

        // ================= AUTH FUNCTIONS =================
        function loginAs(role) {
            const name = role === 'doctor' ? 'Dr. Sarah Mitchell' : 'Alex';
            localStorage.setItem('pc_user', JSON.stringify({ role, name }));
            currentUserRole = role;
            currentUserName = name;
            
            document.getElementById('role-modal').classList.add('hidden');
            document.getElementById('role-modal').classList.remove('flex');
            
            showDashboard();
            showToast('🐾', `Welcome back, ${name}!`);
        }

        function logout() {
            if(confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }

        // ================= DASHBOARD RENDERING =================
        function showDashboard() {
            // Show Main Containers
            document.getElementById('navbar').classList.remove('hidden');
            document.getElementById('main-container').classList.remove('hidden');

            renderNavbar();
            renderSidebar();
            renderMobileNav();
            
            // Set default tab
            currentTab = 'overview';
            loadContent(currentTab);
        }

        function renderNavbar() {
            const linksContainer = document.getElementById('nav-links');
            const userArea = document.getElementById('nav-user-area');
            
            if (currentUserRole === 'user') {
                linksContainer.innerHTML = `
                    <a href="index.html" class="hover:text-cream-600 transition-colors">Home</a>
                    <a href="index.html#symptoms" class="hover:text-cream-600 transition-colors">Symptom Checker</a>
                    <a href="index.html#doctor" class="hover:text-cream-600 transition-colors">Doctors</a>
                    <a href="index.html#shopping" class="hover:text-cream-600 transition-colors">Shop</a>
                `;
                userArea.innerHTML = `
                    <span class="text-sm font-semibold text-bark-500">Hi, Alex 👋</span>
                    <button onclick="loadContent('overview')" class="btn-warm text-sm py-2">My Dashboard</button>
                `;
            } else {
                linksContainer.innerHTML = ``; // Doctor doesn't need public links
                userArea.innerHTML = `
                    <span class="text-sm font-semibold text-bark-500">Dr. Sarah 🩺</span>
                    <button onclick="loginAs('user')" class="btn-outline text-sm py-2 mr-2">Switch to User</button>
                    <button onclick="loadContent('overview')" class="btn-warm !bg-bark-600 text-sm py-2">Doctor Panel</button>
                `;
            }
            lucide.createIcons();
        }

        function renderSidebar() {
            const profile = document.getElementById('sidebar-profile');
            const nav = document.getElementById('sidebar-nav');
            let tabs = [];

            if (currentUserRole === 'user') {
                profile.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-cream-100 flex items-center justify-center text-xl font-bold text-cream-600 border border-cream-200">AX</div>
                    <div>
                        <h4 class="font-bold text-bark-600 text-sm">Alex</h4>
                        <p class="text-xs text-bark-400">Pet Parent</p>
                    </div>
                `;
                tabs = [
                    { id: 'overview', icon: 'home', label: 'Overview' },
                    { id: 'appointments', icon: 'calendar', label: 'My Appointments' },
                    { id: 'pets', icon: 'paw-print', label: 'My Pets' },
                    { id: 'orders', icon: 'shopping-bag', label: 'My Orders' },
                    { id: 'chat', icon: 'message-square', label: 'Chat with Vet' },
                    { id: 'settings', icon: 'settings', label: 'Settings' }
                ];
            } else {
                profile.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-bark-100 flex items-center justify-center text-xl">🩺</div>
                    <div>
                        <h4 class="font-bold text-bark-600 text-sm">Dr. Sarah</h4>
                        <div class="flex items-center gap-1">
                            <span class="text-xs text-bark-400">Veterinarian</span>
                            <span class="text-[10px] text-yellow-500">⭐ 4.9</span>
                        </div>
                    </div>
                `;
                tabs = [
                    { id: 'overview', icon: 'bar-chart-2', label: 'Overview' },
                    { id: 'appointments', icon: 'calendar', label: 'Appointments' },
                    { id: 'messages', icon: 'mail', label: 'Messages' },
                    { id: 'profile', icon: 'user', label: 'Profile' }
                ];
            }

            nav.innerHTML = tabs.map(t => `
                <button onclick="loadContent('${t.id}')" id="tab-${t.id}" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-r-xl text-sm font-medium text-bark-400 hover:bg-cream-50 hover:text-cream-600 transition-all">
                    <i data-lucide="${t.icon}" class="w-5 h-5"></i> ${t.label}
                </button>
            `).join('');
            lucide.createIcons();
            
            // Activate default
            document.getElementById(`tab-${currentTab}`).classList.add('active');
        }

        function renderMobileNav() {
            const nav = document.getElementById('mobile-nav');
            let tabs = currentUserRole === 'user' 
                ? ['overview', 'appointments', 'pets', 'chat', 'settings']
                : ['overview', 'appointments', 'messages', 'profile'];

            const icons = { overview: 'home', appointments: 'calendar', pets: 'paw-print', orders: 'shopping-bag', chat: 'message-square', settings: 'settings', messages: 'mail', profile: 'user' };

            nav.innerHTML = tabs.map(t => `
                <button onclick="loadContent('${t}')" id="mob-${t}" class="mobile-nav-item">
                    <i data-lucide="${icons[t]}" class="w-6 h-6"></i>
                    <span class="capitalize">${t}</span>
                </button>
            `).join('');
            lucide.createIcons();
            document.getElementById(`mob-${currentTab}`).classList.add('active');
        }

        // ================= CONTENT ROUTER =================
        function loadContent(tabId) {
            currentTab = tabId;
            const container = document.getElementById('content-area');
            
            // Update UI Active States
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${tabId}`);
            if(activeTab) activeTab.classList.add('active');

            document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
            const activeMob = document.getElementById(`mob-${tabId}`);
            if(activeMob) activeMob.classList.add('active');

            // Render Content
            container.innerHTML = `<div class="animate-fade">${getContentHTML(tabId)}</div>`;
            lucide.createIcons();
            
            // Post-render scripts (charts, etc)
            if(tabId === 'overview' && currentUserRole === 'doctor') renderDoctorChart();
        }

        function getContentHTML(tabId) {
            if (currentUserRole === 'user') {
                switch(tabId) {
                    case 'overview': return renderUserOverview();
                    case 'appointments': return renderUserAppointments();
                    case 'pets': return renderUserPets();
                    case 'orders': return renderUserOrders();
                    case 'chat': return renderUserChat();
                    case 'settings': return renderUserSettings();
                }
            } else {
                switch(tabId) {
                    case 'overview': return renderDoctorOverview();
                    case 'appointments': return renderDoctorAppointments();
                    case 'messages': return renderDoctorMessages();
                    case 'profile': return renderDoctorProfile();
                }
            }
        }

        // ================= USER VIEWS =================
        function renderUserOverview() {
            const bookings = JSON.parse(localStorage.getItem('pc_bookings') || '[]').filter(b => b.user === 'Alex');
            const pets = JSON.parse(localStorage.getItem('pc_pets') || JSON.stringify(initialPets));
            const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

            return `
                <div class="mb-8 rounded-2xl bg-gradient-to-r from-cream-500 to-cream-600 p-6 md:p-8 text-white shadow-lg relative overflow-hidden">

                                        </td>

        }

        // ================= INTERACTION LOGIC =================
        function showToast(icon, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('t-icon').innerText = icon;
            document.getElementById('t-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function handleBookingSubmit(e) {
            e.preventDefault();
            const bookings = JSON.parse(localStorage.getItem('pc_bookings') || '[]');
            const newBooking = {
                id: Date.now(),
                doctor: document.getElementById('book-doc').value,
                user: 'Alex',
                pet: document.getElementById('book-pet').value,
                date: document.getElementById('book-date').value,
                time: document.getElementById('book-time').value,
                notes: document.getElementById('book-notes').value,
                status: 'pending'
            };
            bookings.push(newBooking);
            localStorage.setItem('pc_bookings', JSON.stringify(bookings));
            
            document.getElementById('booking-modal').classList.add('hidden');
            e.target.reset();
            showToast('✅', 'Appointment requested successfully!');
            
            // Refresh if on appt page
            if(currentTab === 'appointments' || currentTab === 'overview') loadContent(currentTab);
        }

        function cancelBooking(id) {
            if(!confirm('Cancel this appointment?')) return;
            let bookings = JSON.parse(localStorage.getItem('pc_bookings') || '[]');
            bookings = bookings.filter(b => b.id !== id);
            localStorage.setItem('pc_bookings', JSON.stringify(bookings));
            showToast('🗑️', 'Appointment cancelled');
            loadContent('appointments');
        }

        function updateStatus(id, status) {
            let bookings = JSON.parse(localStorage.getItem('pc_bookings') || '[]');
            const idx = bookings.findIndex(b => b.id === id);
            if(idx > -1) {
                bookings[idx].status = status;
                localStorage.setItem('pc_bookings', JSON.stringify(bookings));
                showToast(status === 'confirmed' ? '✅' : 'ℹ️', `Booking ${status}`);
                loadContent('appointments');
            }
        }

        function handleAddPetSubmit(e) {
            e.preventDefault();
            const pets = JSON.parse(localStorage.getItem('pc_pets') || JSON.stringify(initialPets));
            const type = document.getElementById('pet-type').value;
            const emojis = { 'Dog': '🐕', 'Cat': '🐈', 'Bird': '🦜', 'Other': '🐰' };
            
            pets.push({

                type: type,

            });

            document.getElementById('pet-modal').classList.add('hidden');

            if(currentTab === 'pets' || currentTab === 'overview') loadContent(currentTab);
        }

        // Chat Logic
        function handleChatEnter(e) {
            if(e.key === 'Enter') sendChatMessage();
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg) return;

            const box = document.getElementById('chat-box');
            // User Msg
            box.innerHTML += `
                <div class="flex items-end gap-2 justify-end animate-fade">
                    <div class="bg-cream-500 text-white p-3 rounded-2xl rounded-tr-none text-sm max-w-[80%]">${msg}</div>
                </div>
            `;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            // Auto Reply
            setTimeout(() => {
                const replies = [
                    "I see. How long has this been going on?",
                    "Please bring Max in for a checkup.",
                    "That sounds normal, but keep an eye on it.",
                    "Have you changed his diet recently?",
                    "I can prescribe something for that."
                ];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                box.innerHTML += `
                    <div class="flex items-start gap-2 animate-fade">
                        <div class="w-8 h-8 rounded-full bg-bark-100 flex-shrink-0 flex items-center justify-center text-xs">👩‍⚕️</div>
                        <div class="bg-bark-100 p-3 rounded-2xl rounded-tl-none text-sm text-bark-600 max-w-[80%]">${reply}</div>
                    </div>
                `;
                box.scrollTop = box.scrollHeight;
            }, 1500);
        }
    </script>
